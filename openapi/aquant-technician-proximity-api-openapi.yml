openapi: 3.2.0
info:
  title: Aquant MCP Server Technician Proximity API
  version: 1.0.0
tags:
- name: Technician Proximity
paths:
  /technician-proximity:
    post:
      summary: Technician Proximity
      description: "Retrieve technicians and their proximity to an asset location.\n\nArgs:\n    payload: The request body containing asset_location and technicians."
      operationId: technician_proximity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicianProximityRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicianProximityResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Technician Proximity
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TechnicianProximityInfo:
      properties:
        event_agent_name:
          type: string
          title: Event Agent Name
        location:
          type: string
          title: Location
        proximity_km:
          type: number
          title: Proximity Km
      type: object
      required:
      - event_agent_name
      - location
      - proximity_km
      title: TechnicianProximityInfo
    TechnicianProximityResult:
      properties:
        status:
          type: string
          title: Status
        message:
          type: string
          title: Message
        technicians:
          items:
            $ref: '#/components/schemas/TechnicianProximityInfo'
          type: array
          title: Technicians
          default: []
      type: object
      required:
      - status
      title: TechnicianProximityResult
    TechnicianLocation:
      properties:
        event_agent_name:
          type: string
          title: Event Agent Name
        location:
          type: string
          title: Location
      type: object
      required:
      - event_agent_name
      - location
      title: TechnicianLocation
    TechnicianProximityRequest:
      properties:
        asset_location:
          type: string
          title: Asset Location
          description: The asset location to find proximity to
        technicians:
          items:
            $ref: '#/components/schemas/TechnicianLocation'
          type: array
          title: Technicians
          description: List of technicians with their locations
      type: object
      required:
      - asset_location
      - technicians
      title: TechnicianProximityRequest
