openapi: 3.2.0
info:
  title: Aquant MCP Server Agent Data API
  version: 1.0.0
tags:
- name: Agent Data
paths:
  /agent-data:
    post:
      summary: Agent Data
      description: "Retrieve agents and their proficiency scores based on an observation name.\n\nArgs:\n    payload: The request body containing observation_name."
      operationId: agent_data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDataRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDataResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Agent Data
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AgentDataRequest:
      properties:
        observation_name:
          type: string
          title: Observation Name
          description: The observation name to search for agents and proficiency scores.
      type: object
      required:
      - observation_name
      title: AgentDataRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    AgentDataResult:
      properties:
        status:
          type: string
          title: Status
        message:
          type: string
          title: Message
        agents:
          items:
            $ref: '#/components/schemas/AgentInfo'
          type: array
          title: Agents
          default: []
      type: object
      required:
      - status
      title: AgentDataResult
    AgentInfo:
      properties:
        event_agent_name:
          type: string
          title: Event Agent Name
        proficiency_score:
          type: number
          title: Proficiency Score
        location:
          type: string
          title: Location
      type: object
      required:
      - event_agent_name
      - proficiency_score
      - location
      title: AgentInfo
