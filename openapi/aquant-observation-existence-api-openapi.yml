openapi: 3.2.0
info:
  title: Aquant MCP Server Observation Existence API
  version: 1.0.0
tags:
- name: Observation Existence
paths:
  /observation-existence:
    post:
      summary: Observation Existence
      description: "Check if an observation exists in the loaded data.\n\nArgs:\n    payload: The request body containing observation_name."
      operationId: observation_existence
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationExistenceRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationExistenceResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Observation Existence
components:
  schemas:
    ObservationExistenceResult:
      properties:
        status:
          type: string
          title: Status
        message:
          type: string
          title: Message
        exists:
          type: boolean
          title: Exists
        observation_name:
          type: string
          title: Observation Name
      type: object
      required:
      - status
      - exists
      - observation_name
      title: ObservationExistenceResult
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ObservationExistenceRequest:
      properties:
        observation_name:
          type: string
          title: Observation Name
          description: The observation name to check for existence.
      type: object
      required:
      - observation_name
      title: ObservationExistenceRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
