openapi: 3.2.0
info:
  title: Aquant MCP Server Asset Location API
  version: 1.0.0
tags:
- name: Asset Location
paths:
  /asset-location:
    post:
      summary: Asset Location
      description: "Retrieve the location of an asset based on its ID.\n\nArgs:\n    payload: The request body containing asset_id."
      operationId: asset_location
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetLocationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetLocationResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Asset Location
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    AssetLocationRequest:
      properties:
        asset_id:
          type: string
          title: Asset Id
          description: The asset ID to look up location for.
      type: object
      required:
      - asset_id
      title: AssetLocationRequest
    AssetLocationInfo:
      properties:
        asset_id:
          type: string
          title: Asset Id
        location:
          type: string
          title: Location
      type: object
      required:
      - asset_id
      - location
      title: AssetLocationInfo
    AssetLocationResult:
      properties:
        status:
          type: string
          title: Status
        message:
          type: string
          title: Message
        asset_location:
          $ref: '#/components/schemas/AssetLocationInfo'
      type: object
      required:
      - status
      title: AssetLocationResult
