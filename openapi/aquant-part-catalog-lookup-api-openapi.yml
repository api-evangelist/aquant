openapi: 3.2.0
info:
  title: Aquant MCP Server Part Catalog Lookup API
  version: 1.0.0
tags:
- name: Part Catalog Lookup
paths:
  /part-catalog-lookup:
    post:
      summary: Part Catalog Lookup
      description: 'Look up part information from the catalog using a triage product ID and a user question.


        Args:

        payload: The request body containing triage_product_id and question.

        tenant_id: [TEMPORARY] The tenant ID. This should be removed in the future.

        db_session: Mock database session (ready for future replacement with real DB)'
      operationId: part_catalog_lookup
      parameters:
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          description: '[TEMPORARY] The tenant ID. This should be removed in the future.'
          title: Tenant Id
        description: '[TEMPORARY] The tenant ID. This should be removed in the future.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartCatalogLookupRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartCatalogLookupResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Part Catalog Lookup
components:
  schemas:
    PartCatalogLookupResult:
      properties:
        status:
          type: string
          title: Status
        message:
          type: string
          title: Message
        parts:
          items:
            $ref: '#/components/schemas/PartCatalogInfo'
          type: array
          title: Parts
          default: []
      type: object
      required:
      - status
      title: PartCatalogLookupResult
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PartCatalogLookupRequest:
      properties:
        triage_product_id:
          type: string
          title: Triage Product Id
          description: The triage product ID to look up in the catalog.
        question:
          type: string
          title: Question
          description: The user question to match against the catalog.
      type: object
      required:
      - triage_product_id
      - question
      title: PartCatalogLookupRequest
    PartCatalogInfo:
      properties:
        part_id:
          type: string
          title: Part Id
        part_name:
          type: string
          title: Part Name
        part_description:
          type: string
          title: Part Description
        part_image_link:
          type: string
          title: Part Image Link
        part_url_link:
          type: string
          title: Part Url Link
      type: object
      required:
      - part_id
      title: PartCatalogInfo
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
