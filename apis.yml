- aid: aquant:acp-voiceai
  name: Aquant Conversation Platform (VoiceAI) API
  description: 'The Aquant Conversation Platform (ACP) API powers Voice AI and web
    chat with Aquant''s service agents. Clients exchange an API key and secret for a
    one-hour access token at POST /acp/token, then start WebRTC voice calls with the
    named agent or stream web-chat replies as Server-Sent Events from POST /vss/web-chat.
    The public OpenAPI document at /openapi.json currently describes only the liveness
    and readiness probes; the ACP and VSS routes are live and documented in the
    first-party @aquantinc/acp-web-sdk browser SDK rather than in the served spec.'
  humanURL: https://www.npmjs.com/package/@aquantinc/acp-web-sdk
  baseURL: https://voiceai-api.aquant.ai
