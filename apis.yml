apis:
- aid: aquant:mcp-server
  name: Aquant MCP Server
  description: 'The Aquant MCP Server exposes Aquant''s service-intelligence capabilities
    as eleven agent-callable tools — part catalog lookup, part info and sourcing, agent
    (technician) data, technician proximity, observation existence, asset location,
    preventive-maintenance checklists, next-symptom prediction, summary reports, and
    a health check. The same eleven operations are published twice: as MCP tools over
    JSON-RPC Streamable HTTP at /mcp, and as REST POST operations described by a public
    OpenAPI 3.1.0 document at /openapi.json with Swagger UI and ReDoc renderings.'
  humanURL: https://www.aquant.ai/platform
  baseURL: https://mcp.aquant.ai
  tags:
  - Model Context Protocol
  - Agents
  - Field Service
  - Parts
  - Predictive Maintenance
