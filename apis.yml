aid: aquant
name: Aquant
description: 'Aquant is an agentic AI platform built for organizations that manufacture,
  sell, and service complex equipment. It turns a company''s own service content —
  manuals, service histories, parts and warranty data, case notes — and the tacit expertise
  in its technicians'' heads into role-specific AI agents for field technicians, call
  centers, customer self-service, and service leaders. The platform ships a library
  of prebuilt agents (Troubleshooting, Knowledge, Parts, IoT, Voice AI, Vision AI,
  Preventive Maintenance) plus an Agent Studio for building custom agents, and delivers
  them across web, mobile, voice, offline, and API channels into CRM, FSM, and support-portal
  workflows. Aquant exposes two public machine-readable surfaces: an MCP server at
  mcp.aquant.ai that publishes eleven service-intelligence tools over both JSON-RPC
  Streamable HTTP and REST, and the Aquant Conversation Platform (ACP) voice/chat API
  at voiceai-api.aquant.ai fronted by a first-party browser SDK.'
