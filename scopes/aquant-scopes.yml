note: >-
  Neither Aquant OpenAPI declares an oauth2 security scheme, so the mechanical derive pass
  (0-working/derive-oauth-scopes.py) returns nothing. The only OAuth/OIDC surface Aquant
  operates is its Okta customer-identity tenant at login.aquant.ai, which is used for human
  sign-in to the Aquant platform rather than for API authorization. The scopes below are the
  standard OIDC set advertised by that discovery document — they are recorded because they are
  real and anonymously discoverable, NOT because they authorize the MCP or ACP APIs.
applies_to: platform sign-in (login.aquant.ai) — not aquant:mcp-server or aquant:acp-voiceai
